<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ChatConnect</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      color: #1e293b;
    }

    button, input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .hidden {
      display: none !important;
    }

    /* LOGIN AND REGISTRATION */

    #authPage {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      background: linear-gradient(135deg, #4f46e5, #0ea5e9);
    }

    .auth-card {
      background: white;
      padding: 28px;
      border-radius: 18px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 10px 35px #0002;
    }

    .logo {
      text-align: center;
      font-size: 29px;
      font-weight: bold;
      color: #4f46e5;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #64748b;
      margin-bottom: 25px;
    }

    .auth-card input {
      width: 100%;
      padding: 13px;
      border: 1px solid #cbd5e1;
      border-radius: 9px;
      margin-bottom: 13px;
      outline: none;
    }

    .auth-card input:focus {
      border-color: #4f46e5;
    }

    .primary-btn {
      width: 100%;
      padding: 13px;
      background: #4f46e5;
      color: white;
      border: none;
      border-radius: 9px;
      font-weight: bold;
    }

    .primary-btn:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    .switch-text {
      text-align: center;
      margin-top: 20px;
    }

    .switch-btn {
      background: none;
      border: none;
      color: #4f46e5;
      font-weight: bold;
    }

    .status-message {
      color: #dc2626;
      font-size: 14px;
      overflow-wrap: anywhere;
    }

    /* CHAT APPLICATION */

    #chatPage {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 15px;
    }

    .chat-container {
      width: 100%;
      max-width: 900px;
      height: 90vh;
      min-height: 450px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 5px 25px #0001;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .chat-header {
      background: #4f46e5;
      color: white;
      padding: 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .chat-header h2 {
      margin: 0;
      font-size: 22px;
    }

    .chat-header p {
      margin: 5px 0 0;
      font-size: 12px;
      opacity: 0.9;
      overflow-wrap: anywhere;
    }

    .logout-btn {
      background: white;
      color: #4f46e5;
      border: none;
      border-radius: 8px;
      padding: 9px 12px;
    }

    .room-title {
      padding: 12px 16px;
      background: #eef2ff;
      font-weight: bold;
      border-bottom: 1px solid #e2e8f0;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      background: #f8fafc;
    }

    .message {
      max-width: 85%;
      align-self: flex-start;
      background: white;
      border: 1px solid #e2e8f0;
      border-radius: 12px 12px 12px 3px;
      padding: 10px 13px;
      overflow-wrap: anywhere;
    }

    .message.mine {
      align-self: flex-end;
      background: #4f46e5;
      color: white;
      border: none;
      border-radius: 12px 12px 3px 12px;
    }

    .message-author {
      font-size: 12px;
      font-weight: bold;
      margin-bottom: 5px;
      opacity: 0.8;
    }

    .message-text {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .message-time {
      font-size: 10px;
      margin-top: 6px;
      opacity: 0.7;
      text-align: right;
    }

    .chat-footer {
      padding: 12px;
      border-top: 1px solid #e2e8f0;
      background: white;
    }

    #messageForm {
      display: flex;
      gap: 8px;
    }

    #messageInput {
      min-width: 0;
      flex: 1;
      padding: 12px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      outline: none;
    }

    #messageInput:focus {
      border-color: #4f46e5;
    }

    #sendBtn {
      background: #4f46e5;
      color: white;
      border: none;
      padding: 0 18px;
      border-radius: 10px;
    }

    #chatStatus {
      font-size: 12px;
      margin-top: 8px;
      color: #64748b;
    }

    .notice {
      font-size: 12px;
      color: #64748b;
      margin-top: 10px;
      line-height: 1.5;
    }

    @media (max-width: 500px) {
      #chatPage {
        padding: 0;
      }

      .chat-container {
        height: 100vh;
        min-height: 0;
        border-radius: 0;
      }

      .chat-header {
        padding: 14px;
      }

      .chat-header h2 {
        font-size: 19px;
      }
    }
  </style>
</head>

<body>

  <!-- LOGIN AND REGISTRATION PAGE -->

  <section id="authPage">
    <div class="auth-card">

      <div class="logo">ChatConnect</div>

      <p class="subtitle">
        Connect with friends, wherever they are.
      </p>

      <form id="authForm">

        <input
          id="email"
          type="email"
          placeholder="Email address"
          autocomplete="email"
          required
        >

        <input
          id="password"
          type="password"
          placeholder="Password (at least 6 characters)"
          minlength="6"
          autocomplete="current-password"
          required
        >

        <button
          id="authSubmit"
          class="primary-btn"
          type="submit"
        >
          Log In
        </button>

      </form>

      <p id="authStatus" class="status-message"></p>

      <div class="switch-text">
        <span id="switchDescription">Don't have an account?</span>

        <button
          id="switchMode"
          class="switch-btn"
          type="button"
        >
          Register
        </button>
      </div>

      <p class="notice">
        Use an email address you control. Never share your
        password with other people.
      </p>

    </div>
  </section>


  <!-- CHAT PAGE -->

  <section id="chatPage" class="hidden">

    <div class="chat-container">

      <header class="chat-header">
        <div>
          <h2>ChatConnect 💬</h2>
          <p id="userEmail">Connecting...</p>
        </div>

        <button id="logoutBtn" class="logout-btn" type="button">
          Log Out
        </button>
      </header>

      <div class="room-title">
        🌍 Public Chat Room
      </div>

      <div id="messages" aria-live="polite">
        <p>Loading messages...</p>
      </div>

      <footer class="chat-footer">

        <form id="messageForm">

          <input
            id="messageInput"
            type="text"
            maxlength="1000"
            placeholder="Write a message..."
            autocomplete="off"
            required
          >

          <button id="sendBtn" type="submit">
            Send
          </button>

        </form>

        <div id="chatStatus">
          Connecting to chat...
        </div>

      </footer>

    </div>

  </section>


  <!-- FIREBASE AND CHATCONNECT LOGIC -->

  <script type="module">

    import {
      initializeApp
    } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";

    import {
      getAuth,
      createUserWithEmailAndPassword,
      signInWithEmailAndPassword,
      onAuthStateChanged,
      signOut
    } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";

    import {
      getFirestore,
      collection,
      addDoc,
      query,
      orderBy,
      limit,
      onSnapshot,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";


    // =====================================
    // STEP 1: INSERT YOUR FIREBASE CONFIG
    // =====================================

    const firebaseConfig = {
  apiKey: "PASTE_YOUR_API_KEY_HERE",
  authDomain: "chatconnect-e6779.firebaseapp.com",
  projectId: "chatconnect-e6779",
  storageBucket: "chatconnect-e6779.firebasestorage.app",
  messagingSenderId: "204092695541",
  appId: "PASTE_YOUR_APP_ID_HERE"
};


    // =====================================
    // STEP 2: INITIALIZE FIREBASE
    // =====================================

    const authPage = document.getElementById("authPage");
    const chatPage = document.getElementById("chatPage");

    const authForm = document.getElementById("authForm");
    const authSubmit = document.getElementById("authSubmit");
    const authStatus = document.getElementById("authStatus");

    const switchModeBtn = document.getElementById("switchMode");
    const switchDescription = document.getElementById("switchDescription");

    const userEmail = document.getElementById("userEmail");
    const logoutBtn = document.getElementById("logoutBtn");

    const messagesElement = document.getElementById("messages");
    const messageForm = document.getElementById("messageForm");
    const messageInput = document.getElementById("messageInput");
    const sendBtn = document.getElementById("sendBtn");
    const chatStatus = document.getElementById("chatStatus");

    let registering = false;
    let stopListeningToMessages = null;

    function showAuthError(error) {
      const code = error.code || "";

      const errors = {
        "auth/email-already-in-use":
          "This email is already registered. Please log in.",

        "auth/invalid-credential":
          "Incorrect email or password.",

        "auth/invalid-email":
          "Please enter a valid email address.",

        "auth/weak-password":
          "Please choose a stronger password.",

        "auth/too-many-requests":
          "Too many attempts. Please try again later.",

        "auth/network-request-failed":
          "Network error. Check your internet connection.",

        "permission-denied":
          "Access denied. Please check your Firestore security rules."
      };

      authStatus.textContent =
        errors[code] || error.message || "Something went wrong.";
    }

    function showChatError(error) {
      console.error(error);

      chatStatus.textContent =
        "Chat error: " + (error.code || error.message);
    }

    try {

      if (
        firebaseConfig.apiKey === "YOUR_API_KEY" ||
        firebaseConfig.authDomain === "YOUR_AUTH_DOMAIN" ||
        firebaseConfig.projectId === "YOUR_PROJECT_ID" ||
        firebaseConfig.appId === "YOUR_APP_ID"
      ) {
        throw new Error(
          "Firebase configuration is missing. Replace the placeholder values in the code with your Firebase web app configuration."
        );
      }

      const firebaseApp = initializeApp(firebaseConfig);

      const auth = getAuth(firebaseApp);
      const db = getFirestore(firebaseApp);

      const messagesCollection = collection(db, "messages");


      // =====================================
      // STEP 3: REGISTER OR LOG IN
      // =====================================

      switchModeBtn.addEventListener("click", () => {

        registering = !registering;

        authSubmit.textContent =
          registering ? "Create Account" : "Log In";

        switchDescription.textContent =
          registering
            ? "Already have an account?"
            : "Don't have an account?";

        switchModeBtn.textContent =
          registering ? "Log In" : "Register";

        document.getElementById("password").autocomplete =
          registering ? "new-password" : "current-password";

        authStatus.textContent = "";

      });


      authForm.addEventListener("submit", async (event) => {

        event.preventDefault();

        const email =
          document.getElementById("email").value.trim();

        const password =
          document.getElementById("password").value;

        authStatus.textContent = "";
        authSubmit.disabled = true;

        try {

          if (registering) {

            await createUserWithEmailAndPassword(
              auth,
              email,
              password
            );

          } else {

            await signInWithEmailAndPassword(
              auth,
              email,
              password
            );

          }

        } catch (error) {

          showAuthError(error);

        } finally {

          authSubmit.disabled = false;

        }

      });


      // =====================================
      // STEP 4: LISTEN FOR CHAT MESSAGES
      // =====================================

      function startMessageListener(user) {

        if (stopListeningToMessages) {
          stopListeningToMessages();
          stopListeningToMessages = null;
        }

        messagesElement.replaceChildren();

        chatStatus.textContent = "Loading messages...";

        const messagesQuery = query(
          messagesCollection,
          orderBy("createdAt", "asc"),
          limit(100)
        );

        stopListeningToMessages = onSnapshot(
          messagesQuery,

          (snapshot) => {

            messagesElement.replaceChildren();

            if (snapshot.empty) {

              const emptyMessage = document.createElement("p");

              emptyMessage.textContent =
                "No messages yet. Say hello!";

              messagesElement.appendChild(emptyMessage);

            }

            snapshot.forEach((documentSnapshot) => {

              const message = documentSnapshot.data();

              const bubble = document.createElement("div");

              bubble.className =
                "message" +
                (message.uid === user.uid ? " mine" : "");

              const author = document.createElement("div");

              author.className = "message-author";

              author.textContent =
                message.uid === user.uid
                  ? "You"
                  : (message.email || "Chat member");

              const text = document.createElement("div");

              text.className = "message-text";

              text.textContent = message.text || "";

              const time = document.createElement("div");

              time.className = "message-time";

              if (message.createdAt) {

                time.textContent =
                  new Date(
                    message.createdAt.toMillis()
                  ).toLocaleTimeString([], {
                    hour: "2-digit",
                    minute: "2-digit"
                  });

              } else {

                time.textContent = "Sending...";

              }

              bubble.appendChild(author);
              bubble.appendChild(text);
              bubble.appendChild(time);

              messagesElement.appendChild(bubble);

            });

            messagesElement.scrollTop =
              messagesElement.scrollHeight;

            chatStatus.textContent =
              "Connected • Latest 100 messages";

          },

          (error) => {

            showChatError(error);

          }

        );

      }


      // =====================================
      // STEP 5: SEND A MESSAGE
      // =====================================

      messageForm.addEventListener("submit", async (event) => {

        event.preventDefault();

        const user = auth.currentUser;

        if (!user) {

          chatStatus.textContent =
            "Please log in before sending messages.";

          return;

        }

        const text = messageInput.value.trim();

        if (!text) {
          return;
        }

        if (text.length > 1000) {

          chatStatus.textContent =
            "Messages cannot exceed 1000 characters.";

          return;

        }

        sendBtn.disabled = true;

        try {

          await addDoc(messagesCollection, {

            text: text,

            uid: user.uid,

            email: user.email || "Chat member",

            createdAt: serverTimestamp()

          });

          messageInput.value = "";

          messageInput.focus();

        } catch (error) {

          showChatError(error);

        } finally {

          sendBtn.disabled = false;

        }

      });


      // =====================================
      // STEP 6: LOG OUT
      // =====================================

      logoutBtn.addEventListener("click", async () => {

        try {

          await signOut(auth);

        } catch (error) {

          showChatError(error);

        }

      });


      // =====================================
      // STEP 7: CHECK THE LOGIN STATUS
      // =====================================

      onAuthStateChanged(auth, (user) => {

        if (user) {

          authPage.classList.add("hidden");

          chatPage.classList.remove("hidden");

          userEmail.textContent = user.email || "Chat member";

          startMessageListener(user);

        } else {

          chatPage.classList.add("hidden");

          authPage.classList.remove("hidden");

          messagesElement.replaceChildren();

          chatStatus.textContent = "Please log in.";

          if (stopListeningToMessages) {

            stopListeningToMessages();

            stopListeningToMessages = null;

          }

        }

      });

    } catch (error) {

      console.error(error);

      authPage.classList.remove("hidden");

      authStatus.textContent = error.message;

      authSubmit.disabled = true;

    }

  </script>

</body>
</html>
